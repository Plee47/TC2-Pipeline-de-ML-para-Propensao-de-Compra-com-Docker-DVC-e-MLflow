stages:
  preprocess:
    cmd: python -m ecommerce_buy_predictor.pipeline.preprocess_stage
    deps:
      - data/raw/online_shoppers_intention.csv
      - src/ecommerce_buy_predictor/data
      - src/ecommerce_buy_predictor/features/schema.py
      - src/ecommerce_buy_predictor/pipeline/preprocess_stage.py
    params:
      - random_seed
      - split.test_size
    outs:
      - data/processed

  train:
    cmd: python -m ecommerce_buy_predictor.pipeline.train_stage
    deps:
      - data/processed
      - src/ecommerce_buy_predictor/features
      - src/ecommerce_buy_predictor/models/train.py
      - src/ecommerce_buy_predictor/models/evaluate.py
      - src/ecommerce_buy_predictor/pipeline/train_stage.py
    params:
      - random_seed
      - selection_metric
      - models
    outs:
      - models/model.pkl
      - reports/train_metrics.json:
          cache: false

  evaluate:
    cmd: python -m ecommerce_buy_predictor.pipeline.evaluate_stage
    deps:
      - models/model.pkl
      - reports/train_metrics.json
      - src/ecommerce_buy_predictor/models/registry.py
      - src/ecommerce_buy_predictor/pipeline/evaluate_stage.py
    params:
      - selection_metric
    metrics:
      - metrics.json:
          cache: false
