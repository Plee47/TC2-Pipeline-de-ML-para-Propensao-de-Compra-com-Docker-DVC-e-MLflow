[tool.poetry]
name = "mba.fiap.ecommerce.buy.predictor"
version = "0.1.0"
description = "ML Pipeline for e-commerce customer purchase intention prediction"
authors = ["Tech Challenge Team <rafael.gimenes17@gmail.com>"]
readme = "README.md"
packages = [{include = "ecommerce_buy_predictor", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
scikit-learn = "^1.3.0"
mlflow = "^2.9.0"
dvc = "^3.0.0"
pandas = "^2.0.0"
pydantic-settings = "^2.0.0"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
pydantic = "^2.0.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
ruff = "^0.1.0"
httpx = "^0.25.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"
# The package lives under src/; older ruff does not infer that on its own and
# would sort ecommerce_buy_predictor as a third-party import.
src = ["src", "tests"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ecommerce_buy_predictor"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py"]
