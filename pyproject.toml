[tool.poetry]
name = "tech-challenge-fase2"
version = "0.1.0"
description = "ML Pipeline for e-commerce customer purchase intention prediction"
authors = ["Tech Challenge Team <rafael.gimenes17@gmail.com>"]
readme = "README.md"
packages = [{include = "tech_challenge", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
scikit-learn = "^1.3.0"
mlflow = "^2.8.0"
dvc = "^3.0.0"
pandas = "^2.0.0"
pydantic-settings = "^2.0.0"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
pydantic = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
ruff = "^0.1.0"
httpx = "^0.25.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short"
testpaths = ["tests"]
pythonpath = ["src"]
