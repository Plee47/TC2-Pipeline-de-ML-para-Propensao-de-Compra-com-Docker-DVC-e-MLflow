random_seed: 42

split:
  test_size: 0.2

# Metric used to pick the model that goes to the Model Registry.
# PR-AUC, not accuracy: the target is ~15% positives.
selection_metric: average_precision

models:
  LogisticRegression:
    max_iter: 1000
  RandomForest:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 5
    min_samples_leaf: 2
