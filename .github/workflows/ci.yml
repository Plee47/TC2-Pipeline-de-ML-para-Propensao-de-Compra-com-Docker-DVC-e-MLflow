name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pipx install poetry==1.8.5

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint
        run: poetry run ruff check src/ tests/ scripts/

      - name: Tests
        run: poetry run pytest --cov=src --cov-report=term-missing

      - name: Pipeline smoke test
        run: |
          poetry run python scripts/generate_sample_data.py
          poetry run python -m ecommerce_buy_predictor.pipeline.preprocess_stage
          poetry run python -m ecommerce_buy_predictor.pipeline.train_stage
          poetry run python -m ecommerce_buy_predictor.pipeline.evaluate_stage
          poetry run python -c "import json; m = json.load(open('metrics.json')); assert m['promoted'], m"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ecommerce-buy-predictor:ci .
      - name: Boot the API and check /health
        run: |
          docker run -d --name api -p 8000:8000 ecommerce-buy-predictor:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
